plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

base {
    archivesName = "pokeblocks-fabric"
}

// Jars are named pokeblocks-<loader>-<version>-<minecraft_version>[-classifier].jar
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${version}-${minecraft_version}"
}

jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.fabric.mixins.json"
    }
}

repositories {
    // Trinkets (optional accessory-slot integration) + its Cardinal Components transitive deps.
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.ladysnake.org/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_mc_version}:${parchment_version}@zip")
	}
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    // Trinkets: optional at runtime. Present on the compile + dev-run classpath (pulls its Cardinal
    // Components transitives) so the head-slot can be tested in dev; NOT bundled into the shipped jar,
    // and declared optional in fabric.mod.json. The integration code is guarded by an isModLoaded check.
    modCompileOnly "dev.emi:trinkets:${trinkets_version}"
    modLocalRuntime "dev.emi:trinkets:${trinkets_version}"
    // JEI: compile against the API only (the plugin is declared via the jei_mod_plugin entrypoint in
    // fabric.mod.json, so it is only ever loaded when JEI is present); the full jar is dev-runtime only.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    testCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly project(":common")
    // mc-test server-truth SPI — this module recompiles common's sources (incl. PokeblocksStateProvider),
    // so it needs the interface on its compile classpath. Provided by the agent at runtime; never bundled.
    // testCompileOnly too: the `source(project(":common")…allSource)` rule below feeds common's main
    // sources into compileTestJava as well, so the SPI must be on the test compile classpath too.
    compileOnly 'io.mctest:mc-test-agent-core:0.1.0'
    testCompileOnly 'io.mctest:mc-test-agent-core:0.1.0'
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
	
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    from(project(":common").sourceSets.main.resources.srcDirs)
}