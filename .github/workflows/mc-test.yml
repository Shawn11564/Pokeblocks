# Generated by `mc-test init-ci` — see docs/CI.md. Safe to edit + commit.
#
# Builds your plugin/mod, runs your .mctest.yml tests across mc-test.yml, and publishes
# the HTML report (mc-test-report/report.html)
# as a downloadable workflow artifact AND to GitHub Pages.
#
# To host on GitHub Pages (one-time): repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions". The report is ALWAYS uploaded as an artifact too, so this
# works even if you never enable Pages. Pin the engine to a tag (…@v1.2.3) for
# reproducible runs once the engine tags releases.
name: mc-test

on:
  push:
    # master is the release line; multiloader/** are the in-progress rewrite branches,
    # so they get CI (build + hosted report artifact) before landing on master.
    branches: [master, 'multiloader/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write       # publish the report to GitHub Pages
  id-token: write    # required by the Pages deploy

concurrency:
  group: mc-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mc-test:
    uses: Shawn11564/mc-test/.github/workflows/mc-test-ci.yml@main
    with:
      java-version: '21'
      node-version: '20'
      build-command: './gradlew build'
      tests: 'mctests/**/*.mctest.yml'
      targets: 'all'
      matrix: 'mc-test.yml'
      # Engine agent jars to build so server-truth steps (assertPluginState / mod.loaded)
      # RUN instead of honest-skipping. Space-separated. Paper/Spigot plugins: "server-bukkit".
      # Modded servers: "server-fabric server-neoforge". See docs/CI.md.
      agents: 'server-fabric server-neoforge'
      pages: true
