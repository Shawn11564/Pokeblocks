plugins {
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

base {
    archivesName = "geckolib-examples-ml-common-${minecraft_version}"
}

minecraft {
    version(minecraft_version)

    // Because Minecraft makes BlockEntities impossible to register in common without it
    accessWideners(file("src/main/resources/${mod_id}.accesswidener"))
}

dependencies {
    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'
    implementation "software.bernie.geckolib:geckolib-common-${minecraft_version}:${geckolib_version}"
    // mc-test server-truth SPI (McTestStateProvider). compileOnly: the matching server-* agent jar
    // provides the class at runtime; bundling it would break ServiceLoader class identity. From mavenLocal.
    compileOnly 'io.mctest:mc-test-agent-core:0.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.5'
}

test {
    useJUnitPlatform()
}

repositories {
    mavenCentral()
}