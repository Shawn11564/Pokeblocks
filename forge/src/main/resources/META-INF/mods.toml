modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.${mod_id}]] #optional
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
mandatory = true
versionRange = "${geckolib_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional: when JEI is present, the Pokeblocks JEI plugin (found by @JeiPlugin annotation scanning) lists
# every doll variant and renders the mod's custom crafting recipes. Absent → nothing changes.
[[dependencies.${mod_id}]]
modId = "jei"
mandatory = false
versionRange = "[19,)"
ordering = "NONE"
side = "CLIENT"
