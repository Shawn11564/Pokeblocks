plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

base {
    archivesName = "pokeblocks-forge"
}

// Jars are named pokeblocks-<loader>-<version>-<minecraft_version>[-classifier].jar
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${version}-${minecraft_version}"
}
mixin {
    config("${mod_id}.mixins.json")
}
jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json"
    }
}

minecraft {
    mappings("parchment", "${parchment_mc_version}-${parchment_version}-${minecraft_version}")

    copyIdeResources = true
    reobf = false

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    // JEI: API at compile time only (the @JeiPlugin class is found by annotation scanning, so nothing
    // links against JEI unless it is installed); the full jar is dev-runtime only. No fg.deobf: Forge
    // 1.21 runs on Mojang names and JEI publishes Mojang-named jars, so deobf would only add a build-time
    // dependency on the Parchment maven.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    testCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly project(":common")
    // mc-test server-truth SPI — this module recompiles common's sources (incl. PokeblocksStateProvider),
    // so it needs the interface on its compile classpath. Provided by the agent at runtime; never bundled.
    // The interface is vendored in :mctest-spi (mc-test-agent-core is only ever in a local mavenLocal).
    // testCompileOnly too: the `source(project(":common")…allSource)` rule below feeds common's main
    // sources into compileTestJava as well, so the SPI must be on the test compile classpath too.
    compileOnly project(":mctest-spi")
    testCompileOnly project(":mctest-spi")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand project.properties
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}