pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'Parchment'
            url = 'https://maven.parchmentmc.org'
            // Only Parchment's own groups live here. Scoping it keeps an outage of this host from
            // failing lookups of every other plugin (Gradle probes repositories in order).
            content { includeGroupAndSubgroups 'org.parchmentmc' }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Pokeblocks'
include("mctest-spi")
include("common")
include("fabric")
include("forge")
include("neoforge")
