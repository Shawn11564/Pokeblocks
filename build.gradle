plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
}

subprojects {
    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    java.withSourcesJar()
    java.withJavadocJar()
        
    jar {
        manifest {
            attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : project.version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
            ])
        }
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
			name = 'GeckoLib'
			url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        }
        maven {
            name = 'Parchment'
            url = 'https://maven.parchmentmc.org'
            // Only Parchment's own groups (mappings zip, librarian plugin, feather) live here. Scoping
            // it keeps an outage of this host from failing lookups of unrelated artifacts.
            content { includeGroupAndSubgroups 'org.parchmentmc' }
        }
        // JEI. Scoped to its group so Gradle resolves it here directly instead of probing every
        // earlier repository first (a slow/unreachable mirror would otherwise fail the build).
        exclusiveContent {
            forRepository {
                maven {
                    name = 'JEI (BlameJared)'
                    url = 'https://maven.blamejared.com'
                }
            }
            filter { includeGroup 'mezz.jei' }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.getRelease().set(21)
    }

    processResources {
        def expandProps = [
                "version": version,
                "group": project.group,
                "minecraft_version": minecraft_version,
                "forge_version": forge_version,
                "forge_loader_version_range": forge_loader_version_range,
                "forge_version_range": forge_version_range,
                "minecraft_version_range": minecraft_version_range,
                "geckolib_version_range": geckolib_version_range,
                "geckolib_version": geckolib_version,
                "fabric_version": fabric_version,
                "fabric_loader_version": fabric_loader_version,
                "mod_name": mod_name,
                "mod_author": mod_author,
                "mod_id": mod_id,
                "license": license,
                "description": project.description,
                "neoforge_version": neoforge_version,
                "neoforge_loader_version_range": neoforge_loader_version_range
        ]

        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand expandProps
        }
		
        inputs.properties(expandProps)
    }
}
