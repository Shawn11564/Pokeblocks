plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
    id 'java-library'
}

base {
    archivesName = "pokeblocks-neoforge"
}

// Jars are named pokeblocks-<loader>-<version>-<minecraft_version>[-classifier].jar
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${version}-${minecraft_version}"
}

subsystems {
    parchment {
        minecraftVersion = project.parchment_mc_version
        mappingsVersion = project.parchment_version
    }
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Curios (optional accessory-slot integration). NeoForge-only on 1.21.1.
    maven { url = 'https://maven.theillusivec4.top/' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly project(":common")
    // Curios: optional at runtime. The -api classifier is enough to compile the integration; the
    // full jar is added to the dev runtime only (localRuntime) so the head-slot can be tested in-dev
    // without forcing Curios on end users (the code is guarded behind a ModList curios check, and the
    // mod is declared an optional dependency in neoforge.mods.toml).
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // JEI: API at compile time only (the @JeiPlugin class is found by annotation scanning, so nothing
    // links against JEI unless it is installed); the full jar is dev-runtime only.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    testCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // mc-test server-truth SPI — this module recompiles common's sources (incl. PokeblocksStateProvider),
    // so it needs the interface on its compile classpath. Provided by the agent at runtime; never bundled.
    // testCompileOnly too: the `source(project(":common")…allSource)` rule below feeds common's main
    // sources into compileTestJava as well, so the SPI must be on the test compile classpath too.
    compileOnly 'io.mctest:mc-test-agent-core:0.1.0'
    testCompileOnly 'io.mctest:mc-test-agent-core:0.1.0'
}

Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
    source(project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
    from project(":common").sourceSets.main.resources
}