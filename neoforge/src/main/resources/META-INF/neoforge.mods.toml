modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mixins]]
config = "pokeblocks.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type="required"
versionRange = "${geckolib_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional: when Curios is present, pokedolls become equippable in a Curios "head" accessory slot.
# Absent → the mod runs unchanged and dolls still wear in the vanilla helmet slot.
[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[9.5,)"
ordering = "AFTER"
side = "BOTH"